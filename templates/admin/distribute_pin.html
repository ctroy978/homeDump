{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<section class="card">
  <h2>Enter distribution PIN</h2>
  <p class="help-text">
    Register <strong>{{ display_title }}</strong> for makeup homework.
  </p>
  <p class="assignment-meta">{{ repo }} / {{ path }}</p>

  {% if error %}
  <p class="status-note error">{{ error }}</p>
  {% endif %}

  <form class="upload-form" action="/admin/distribute/pin" method="post">
    <input type="hidden" name="repo" value="{{ repo }}">
    <input type="hidden" name="path" value="{{ path }}">
    <label for="pin">4-digit PIN</label>
    <input
      id="pin"
      name="pin"
      type="password"
      inputmode="numeric"
      pattern="[0-9]{4}"
      maxlength="4"
      autocomplete="off"
      required
      autofocus
    >
    <button type="submit">Continue</button>
  </form>
</section>
{% endblock %}
